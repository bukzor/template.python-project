$schema: "http://json-schema.org/draft-07/schema#"
description: >
  Design-tower goal — how we accomplish the mission. The body states the goal;
  why[] links upward to the mission (or a higher goal) it serves.
type: object
additionalProperties: false
properties:
  why:
    description: Paths to the mission or higher goal this goal serves.
    type: array
    items:
      type: string
  tags:
    description: Topic tags for cross-referencing.
    type: array
    items:
      type: string
